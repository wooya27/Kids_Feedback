[project]
name = "kids-feedback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.138.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "langgraph>=0.2",
    "tenacity<9.2.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
# 프로젝트 루트를 import 경로에 넣어 tests/에서 `import database` 등이 되게 한다.
pythonpath = ["."]
testpaths = ["tests"]
