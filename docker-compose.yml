# docker-compose.yml = "여러 컨테이너를 한 번에 정의하고 같이 띄우는 설계도"
#   api(FastAPI) + db(PostgreSQL) + n8n 세 개를 한 네트워크로 묶는다.
# 실행: docker compose up --build

services:
  # ── ① DB 컨테이너 (PostgreSQL) ──────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}   # .env에 없으면 기본 1234
      POSTGRES_DB: kids_feedback_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data    # 데이터가 컨테이너 꺼져도 안 날아가게 보관

  # ── ② API 컨테이너 (우리 FastAPI) ───────────────────────
  api:
    build: .                               # 현재 폴더의 Dockerfile로 빌드
    environment:
      # ★ 핵심: host가 localhost가 아니라 'db' (같은 compose 안 서비스 이름)
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-1234}@db:5432/kids_feedback_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}    # .env(호스트)에서 주입 — 깃엔 안 올라감
    ports:
      - "8001:8000"                        # 호스트 8001 → 컨테이너 8000 (8000은 이 PC의 다른 앱이 점유 중)
    depends_on:
      - db                                 # db 먼저 뜨고 나서 api

  # ── ③ n8n 컨테이너 (자동화) ─────────────────────────────
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"                        # http://localhost:5678 로 접속
    environment:
      N8N_SECURE_COOKIE: "false"           # 로컬 http 접속 허용
    volumes:
      - n8ndata:/home/node/.n8n
    # n8n의 HTTP Request 노드에서 우리 API 주소는:  http://api:8000/feedbacks/generate
    # (n8n도 같은 네트워크라 'localhost'가 아니라 서비스 이름 'api'로 부른다)

volumes:
  pgdata:
  n8ndata:
